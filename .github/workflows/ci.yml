name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'state/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'state/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint

      # redact.test.ts はローカル共有スクリプト ~/.claude/scripts/redact.cjs に
      # 依存する sink contract test / smoke test を含むが、CI ランナーには
      # ホームディレクトリの共有スクリプトが存在しない。そのため、正本の
      # ミラーである fixtures/claude-scripts/redact.cjs を CLAUDE_SCRIPTS_DIR
      # 経由で参照させることで、除外せずに CI 上でも実行する。
      - name: Test
        run: npm test
        env:
          CLAUDE_SCRIPTS_DIR: ${{ github.workspace }}/fixtures/claude-scripts

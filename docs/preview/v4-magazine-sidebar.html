<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<title>v4: マガジン + サイドバー + 検索 | Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root[data-theme="dark"]{
  --bg:#15110e; --panel:#1c1814; --card:#221d18; --line:#332b22;
  --fg:#ece6dd; --muted:#9b9285; --link:#e0b07a;
  --accent:#d4a574; --accent2:#7da3d4;
  --paper:#221d18;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#faf8f3; --panel:#fffdf7; --card:#ffffff; --line:#e9e3d6;
  --fg:#1c1917; --muted:#6b6b66; --link:#9f1239;
  --accent:#9f1239; --accent2:#1e3a8a;
  --paper:#ffffff;
  --shadow:0 2px 12px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,"Times New Roman",serif}

.layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:100vh}

/* ── Sidebar ──────────────────── */
aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);
  border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column}
aside .kicker{font-size:10px;letter-spacing:.4em;color:var(--accent);font-weight:600;margin:0 0 6px;text-transform:uppercase}
aside .brand{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  font-size:22px;margin:0 0 4px;font-weight:600;line-height:1.2;border-bottom:2px double var(--fg);padding-bottom:8px}
aside .vol{color:var(--muted);font-size:11px;letter-spacing:.15em;margin:8px 0 14px}
aside .search{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--line);
  color:var(--fg);border-radius:4px;font-size:13px;font-family:inherit}
aside .search:focus{outline:none;border-color:var(--accent)}
aside h2.sec{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.25em;
  margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
aside .toc{display:flex;flex-direction:column;gap:2px}
aside .toc>.cat{display:flex;align-items:center;gap:8px;padding:6px 8px;text-decoration:none;color:var(--fg);
  border-radius:4px;font-size:13px;cursor:pointer}
aside .toc>.cat:hover{background:var(--card)}
aside .toc>.cat .icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:4px;background:var(--card);border:1px solid var(--line);font-size:12px}
aside .toc>.cat .count{margin-left:auto;color:var(--muted);font-size:10px;letter-spacing:.1em}
aside .articles{margin:2px 0 6px 30px;display:flex;flex-direction:column;gap:1px}
aside .articles a{font-size:11px;color:var(--muted);padding:2px 8px;text-decoration:none;
  line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line)}
aside .articles a:hover{color:var(--fg);border-left-color:var(--accent)}
.bottom{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:8px}
.bottom button{flex:1;background:none;border:1px solid var(--line);color:var(--fg);
  padding:7px;border-radius:4px;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.bottom button:hover{border-color:var(--accent);color:var(--accent)}

/* ── Main ──────────────────── */
main{padding:36px 44px 80px;max-width:1100px}
.masthead{border-bottom:3px double var(--fg);padding-bottom:18px;margin-bottom:28px;text-align:center}
.masthead .label{font-size:10px;letter-spacing:.4em;color:var(--accent);font-weight:600;text-transform:uppercase}
.masthead h1{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  font-size:36px;margin:6px 0 4px;letter-spacing:.04em;font-weight:600}
.masthead .meta{color:var(--muted);font-size:12px;letter-spacing:.08em}

.section-label{font-family:"Hiragino Mincho ProN",Georgia,serif;font-size:11px;letter-spacing:.3em;color:var(--accent);
  text-transform:uppercase;border-top:1px solid var(--fg);padding-top:8px;margin:28px 0 14px;font-weight:600}

/* ── Hero ──────────────────── */
.hero{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin:14px 0 36px}
.hero .h-item{background:var(--paper);padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.hero .h-item:first-child{grid-row:span 2;background:linear-gradient(180deg,var(--paper),transparent)}
.hero .h-num{font-family:"Hiragino Mincho ProN",Georgia,serif;font-size:38px;color:var(--accent);
  line-height:1;margin-bottom:8px;font-weight:600}
.hero .h-text{font-size:14px;line-height:1.6}
.hero .h-item:first-child .h-text{font-size:18px;line-height:1.55;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}

/* ── Category ──────────────────── */
.cat{margin:46px 0 0;scroll-margin-top:20px}
.cat-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:16px}
.cat-icon{font-size:20px}
.cat-name{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;margin:0;font-weight:600}
.cat-count{color:var(--muted);font-size:11px;margin-left:auto;letter-spacing:.2em}

/* ── Cards ──────────────────── */
.articles-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cat[data-single="true"] .articles-grid{grid-template-columns:1fr}
.cat[data-single="true"] .articles-grid .card{max-width:760px}
.card{background:var(--paper);border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);scroll-margin-top:16px}
.card.fade{display:none}
.card-tagline{font-size:9px;letter-spacing:.25em;color:var(--accent);font-weight:600;text-transform:uppercase;margin:0 0 6px}
.card h3{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;margin:0 0 6px;line-height:1.45;font-weight:600}
.card h3 a{color:var(--fg);text-decoration:none;border-bottom:1px solid transparent}
.card h3 a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.card .trans{font-size:12px;color:var(--muted);margin:0 0 10px;font-style:italic;font-family:"Hiragino Mincho ProN",Georgia,serif}
.card .byline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted);
  letter-spacing:.1em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px dotted var(--line);text-transform:uppercase}
.card .byline .sep{color:var(--line)}
.card .byline .fresh{color:#22c55e;font-weight:700}
.card .byline .recur{color:var(--accent2);font-weight:700}
.card .byline .src{font-weight:600;color:var(--fg)}
.card .lead{font-size:14px;line-height:1.75;margin:0 0 10px}
.card .lead::first-letter{font-family:"Hiragino Mincho ProN",Georgia,serif;font-size:34px;
  float:left;line-height:1;padding:4px 8px 0 0;color:var(--accent);font-weight:600}
details{margin-top:10px}
details>summary{font-size:10px;letter-spacing:.25em;color:var(--accent);cursor:pointer;
  text-transform:uppercase;font-weight:600;list-style:none;padding:8px 0;border-top:1px solid var(--line)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ READ MORE"}
details[open]>summary::before{content:"▾ HIDE"}
details p{font-size:13px;margin:10px 0;color:var(--fg);opacity:.9}

.empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1;font-style:italic}
.footer{text-align:center;margin-top:60px;color:var(--muted);font-size:10px;letter-spacing:.3em;text-transform:uppercase}

@media (max-width:880px){
  .layout{grid-template-columns:1fr}
  aside{position:relative;height:auto}
  main{padding:24px 20px 60px}
  .hero{grid-template-columns:1fr}
  .hero .h-item:first-child{grid-row:auto}
  .articles-grid{grid-template-columns:1fr}
  .masthead h1{font-size:28px}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <p class="kicker">Daily Edition</p>
    <h1 class="brand">Claude<br>News</h1>
    <p class="vol">VOL. 001 · 2026-06-01</p>
    <input class="search" id="q" placeholder="🔍 Search articles...">
    <h2 class="sec">Sections</h2>
    <nav class="toc" id="toc"></nav>
    <div class="bottom">
      <button id="theme">☾ Light</button>
      <button onclick="document.querySelectorAll('details').forEach(d=>d.open=true)">Expand All</button>
    </div>
  </aside>

  <main>
    <header class="masthead">
      <p class="label">Anthropic & Claude Weekly Digest</p>
      <h1>AI Industry Digest</h1>
      <p class="meta">2026-06-01 ・ 🆕 0 NEW ・ 🔁 11 RECURRING ・ ED. claude-sonnet-4-6</p>
    </header>

    <p class="section-label">Today's Top Stories</p>
    <div class="hero" id="hero"></div>

    <div id="main"></div>

    <p class="footer">— END OF EDITION —</p>
  </main>
</div>

<script src="data.js"></script>
<script>
const root = document.documentElement;
const themeBtn = document.getElementById('theme');
themeBtn.onclick = () => {
  const t = root.getAttribute('data-theme')==='dark' ? 'light':'dark';
  root.setAttribute('data-theme',t);
  themeBtn.textContent = t==='dark' ? '☾ Light' : '☀ Dark';
};

const d = window.NEWS_DATA;
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}

document.getElementById('hero').innerHTML = d.highlights.map((h,i)=>
  `<div class="h-item">
     <div class="h-num">${String(i+1).padStart(2,'0')}</div>
     <div class="h-text">${h}</div>
   </div>`).join('');

document.getElementById('toc').innerHTML = d.categories.map(c=>`
  <a class="cat" href="#cat-${c.key}">
    <span class="icon">${c.icon}</span>
    <span>${c.name}</span>
    <span class="count">${String(c.items.length).padStart(2,'0')}</span>
  </a>
  <div class="articles">
    ${c.items.map(i=>`<a href="#a-${slug(i.title)}">${i.title}</a>`).join('')}
  </div>
`).join('');

document.getElementById('main').innerHTML = d.categories.map(c=>`
  <section class="cat" id="cat-${c.key}" data-single="${c.items.length===1}">
    <div class="cat-head">
      <span class="cat-icon">${c.icon}</span>
      <h2 class="cat-name">${c.name}</h2>
      <span class="cat-count">${String(c.items.length).padStart(2,'0')} STORIES</span>
    </div>
    <div class="articles-grid">
      ${c.items.map(card).join('')}
    </div>
  </section>
`).join('');

function card(it){
  const srcLabel = it.source==='hacker-news'
    ? `<span class="src">HACKER NEWS</span>${it.points?` · ${it.points}PT`:''}`
    : `<span class="src">ANTHROPIC</span>`;
  const tagline = it.source==='hacker-news' ? 'COMMUNITY' : 'OFFICIAL';
  const stateCls = it.state==='新規' ? 'fresh' : 'recur';
  const stateText = it.state==='新規' ? 'NEW' : `RECURRING · ${it.recurrence}TH`;
  const body = (it.body||[]).length
    ? `<details><summary></summary>${it.body.map(p=>`<p>${p}</p>`).join('')}</details>` : '';
  const text = (it.title+it.translation+it.summary+(it.body||[]).join('')).toLowerCase();
  return `<article class="card" id="a-${slug(it.title)}" data-text="${text}">
    <div class="card-tagline">${tagline}</div>
    <h3><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></h3>
    <p class="trans">${it.translation||''}</p>
    <p class="byline">
      ${srcLabel}<span class="sep">·</span>
      <span>${it.date}</span><span class="sep">·</span>
      <span class="${stateCls}">${stateText}</span>
    </p>
    <p class="lead">${it.summary}</p>
    ${body}
  </article>`;
}

// 検索
const q = document.getElementById('q');
q.addEventListener('input', e => {
  const v = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.card').forEach(el=>{
    el.classList.toggle('fade', v && !el.dataset.text.includes(v));
  });
  document.querySelectorAll('.cat').forEach(sec=>{
    const has = sec.querySelectorAll('.card:not(.fade)').length>0;
    sec.style.display = has ? '' : 'none';
  });
});
</script>
</body>
</html>

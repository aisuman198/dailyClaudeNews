<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>v1: アイコン目次 + カラーピル | Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#f7f7f9; --fg:#1f2328; --muted:#57606a; --line:#d0d7de;
  --card:#ffffff; --card-shadow:0 1px 3px rgba(0,0,0,.04);
  --link:#0969da;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  background:var(--bg);color:var(--fg);margin:0;line-height:1.7;}
.wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
header.page{margin-bottom:24px}
.title{font-size:28px;font-weight:700;margin:0 0 6px}
.subtitle{color:var(--muted);font-size:13px;margin:0}
.kv{display:inline-flex;gap:6px;align-items:center}
.kv + .kv::before{content:"・";color:var(--line);margin:0 2px}
h2{font-size:18px;margin:36px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.highlights{background:#fffbe6;border-left:4px solid #f5b400;padding:14px 18px;border-radius:6px;margin:18px 0 28px}
.highlights ul{margin:0;padding-left:20px}
.highlights li{margin:4px 0}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.toc a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);
  background:var(--bg);padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);
  transition:transform .1s ease}
.toc a:hover{transform:translateY(-1px)}
.toc .count{color:var(--muted);font-size:12px}
.cat-head{display:flex;align-items:center;gap:10px;margin:30px 0 14px;padding:8px 14px;border-radius:6px;color:#fff;font-weight:600;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px;box-shadow:var(--card-shadow)}
.card h3{margin:0 0 8px;font-size:17px;line-height:1.4}
.card h3 a{color:var(--link);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.trans{color:var(--muted);font-size:13px;margin:0 0 12px}
.trans b{color:var(--fg);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;line-height:1.4;border:1px solid transparent}
.pill.src-hn{background:#fff4e6;color:#cc6b00;border-color:#ffd699}
.pill.src-blog{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.pill.pt{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.pill.date{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
.pill.state-fresh{background:#dcfce7;color:#166534;border-color:#86efac}
.pill.state-recur{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.summary{margin:0 0 8px}
details{margin-top:8px;padding:0;border-top:1px dashed var(--line);padding-top:8px}
details>summary{cursor:pointer;color:var(--link);font-size:13px;list-style:none;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";font-size:12px;display:inline-block;transition:transform .15s}
details[open]>summary::before{content:"▾ "}
details>p{margin:10px 0;color:#3d444c}
footer{margin-top:60px;color:var(--muted);font-size:12px;text-align:center}
.scrolltop{position:fixed;right:18px;bottom:18px;background:var(--card);border:1px solid var(--line);
  border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;box-shadow:var(--card-shadow);text-decoration:none;color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1 class="title">2026-06-01 のニュース</h1>
    <p class="subtitle">
      <span class="kv">📅 2026-06-01</span>
      <span class="kv">🆕 新規 0 件</span>
      <span class="kv">🔁 継続 11 件</span>
      <span class="kv">🤖 claude-sonnet-4-6</span>
    </p>
  </header>

  <div class="highlights">
    <strong>本日のハイライト</strong>
    <ul id="highlights"></ul>
  </div>

  <nav class="toc" id="toc" aria-label="カテゴリ目次"></nav>

  <main id="main"></main>

  <footer>
    Pages 改善案 v1 — アイコン目次 + カラーピル + 折りたたみ本文
  </footer>
</div>
<a href="#" class="scrolltop" title="トップへ">↑</a>

<script src="data.js"></script>
<script>
const d = window.NEWS_DATA;
document.getElementById('highlights').innerHTML =
  d.highlights.map(h=>`<li>${h}</li>`).join('');

const toc = document.getElementById('toc');
toc.innerHTML = d.categories.map(c =>
  `<a href="#cat-${c.key}" style="border-color:${c.color}33">
     <span>${c.icon}</span><span>${c.name}</span>
     <span class="count">${c.items.length}</span>
   </a>`).join('');

const main = document.getElementById('main');
main.innerHTML = d.categories.map(c => `
  <section id="cat-${c.key}">
    <div class="cat-head" style="background:${c.color}">
      <span>${c.icon}</span><span>${c.name}</span>
      <span style="opacity:.85;font-weight:500;font-size:13px">${c.items.length} 件</span>
    </div>
    ${c.items.map(card).join('')}
  </section>`).join('');

function card(it){
  const srcCls = it.source==='hacker-news' ? 'src-hn' : 'src-blog';
  const srcIcon = it.source==='hacker-news' ? '🔥' : '🧠';
  const srcLabel = it.source==='hacker-news' ? 'HN' : 'Anthropic';
  const stateCls = it.state==='新規' ? 'state-fresh' : 'state-recur';
  const stateIcon = it.state==='新規' ? '🆕' : '🔁';
  const stateText = it.state==='新規' ? '新規' : `継続 ×${it.recurrence}`;
  const trans = it.translation ? `<p class="trans"><b>訳</b>: ${it.translation}</p>` : '';
  const ptPill = it.points ? `<span class="pill pt">⭐ ${it.points}pt</span>` : '';
  const bodyHtml = (it.body||[]).length
    ? `<details><summary>続きを読む（${it.body.length}段落）</summary>
        ${it.body.map(p=>`<p>${p}</p>`).join('')}
       </details>` : '';
  return `
   <article class="card">
     <h3><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></h3>
     ${trans}
     <div class="meta">
       <span class="pill ${srcCls}">${srcIcon} ${srcLabel}</span>
       ${ptPill}
       <span class="pill date">📅 ${it.date}</span>
       <span class="pill ${stateCls}">${stateIcon} ${stateText}</span>
     </div>
     <p class="summary">${it.summary}</p>
     ${bodyHtml}
   </article>`;
}
</script>
</body>
</html>
